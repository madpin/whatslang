            <text x="56" y="6" font-size="15" font-weight="700" fill="#18181b">Joke Bot</text>
            <text x="56" y="26" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#16a34a">[joke]</text>
          </g>
          <text x="24" y="98" font-size="11" fill="#52525b">Replies with a short, family-friendly joke matching the user</text>
          <text x="24" y="114" font-size="11" fill="#52525b">&#8217;s language.</text>
          <text x="24" y="130" font-size="11" fill="#52525b"></text>
          <g transform="translate(24,144)">
            <g transform="translate(0,0)"><rect width="56" height="22" rx="11" fill="#dbeafe"/><text x="28" y="15" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">Text</text></g>
          </g>
          <g transform="translate(304,158)">
            <rect width="108" height="28" rx="8" fill="#f4f4f5"/>
            <text x="54" y="18" text-anchor="middle" font-size="11" font-weight="600" fill="#52525b">Start →</text>
          </g>
        </g>
        <g transform="translate(460,220)" filter="url(#cardShadow)">
          <rect width="436" height="200" rx="14" fill="white" stroke="#e4e4e7"/>
          <g transform="translate(24,24)">
            <text font-size="32">🥗</text>
            <text x="56" y="6" font-size="15" font-weight="700" fill="#18181b">Health Coach</text>
            <text x="56" y="26" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#16a34a">[health]</text>
          </g>
          <text x="24" y="98" font-size="11" fill="#52525b">Empathic but honest. Estimates kcal &amp; macros from food p</text>
          <text x="24" y="114" font-size="11" fill="#52525b">hotos. Transcribes voice notes.</text>
          <text x="24" y="130" font-size="11" fill="#52525b"></text>
          <g transform="translate(24,144)">
            <g transform="translate(0,0)"><rect width="56" height="22" rx="11" fill="#dbeafe"/><text x="28" y="15" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">Text</text></g><g transform="translate(64,0)"><rect width="56" height="22" rx="11" fill="#fde68a"/><text x="28" y="15" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">Image</text></g><g transform="translate(128,0)"><rect width="56" height="22" rx="11" fill="#fbcfe8"/><text x="28" y="15" text-anchor="middle" font-size="10" font-weight="600" fill="#9d174d">Audio</text></g><g transform="translate(192,0)"><rect width="56" height="22" rx="11" fill="#ddd6fe"/><text x="28" y="15" text-anchor="middle" font-size="10" font-weight="600" fill="#5b21b6">Video</text></g>
          </g>
          <g transform="translate(304,158)">
