          <text x="44" y="20" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#16a34a">[ai]</text>
          <text x="84" y="20" font-size="11" fill="#27272a">Friends</text>
          <circle cx="270" cy="16" r="4" fill="#22c55e"/>
          <text x="306" y="20" text-anchor="end" font-size="10" fill="#71717a">4h 12m</text>
        </g>
        <g transform="translate(0,38)">
          <rect width="320" height="32" rx="8" fill="#f9fafb"/>
          <text x="14" y="22" font-size="18">🌐</text>
          <text x="44" y="20" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#16a34a">[ai]</text>
          <text x="84" y="20" font-size="11" fill="#27272a">Work group</text>
          <circle cx="270" cy="16" r="4" fill="#22c55e"/>
