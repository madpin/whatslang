          <text x="14" y="20" font-size="11" font-weight="700" fill="#22c55e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">[ai]</text>
          <text x="64" y="20" font-size="11" font-weight="600" fill="#f4f4f5">Work group</text>
          <text x="160" y="20" font-size="11" fill="#a1a1aa">OCRed sign in photo, translated EN → PT</text>
          <text x="610" y="20" text-anchor="end" font-size="10" fill="#a1a1aa">44m ago</text>
        </g>
        <g transform="translate(0,180)">
          <rect width="624" height="32" rx="8" fill="#27272a" opacity="0.5"/>
          <text x="14" y="20" font-size="11" font-weight="700" fill="#22c55e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">[health]</text>
          <text x="64" y="20" font-size="11" font-weight="600" fill="#f4f4f5">DM Sam</text>
          <text x="160" y="20" font-size="11" fill="#a1a1aa">Voice note transcribed, suggested a walk</text>
          <text x="610" y="20" text-anchor="end" font-size="10" fill="#a1a1aa">1h ago</text>
