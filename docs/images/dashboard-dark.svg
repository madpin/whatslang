    <line x1="228" y1="64" x2="1440" y2="64" stroke="#27272a"/>
    <g transform="translate(252,22)">
      <text font-size="16" font-weight="700" fill="#f4f4f5">Dashboard</text>
      <text y="20" font-size="11" fill="#a1a1aa">Overview of chats, bots and activity</text>
