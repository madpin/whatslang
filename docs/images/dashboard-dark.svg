        <text x="20" y="60" font-size="28" font-weight="700" fill="#f4f4f5">4</text>
        <text x="20" y="80" font-size="10" fill="#a1a1aa">translation, joke, ...</text>
      </g>
      <g transform="translate(660,0)" filter="url(#cardShadowDark)">
