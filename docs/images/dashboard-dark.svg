          <text x="60" y="22" font-size="12" font-weight="600" fill="#f4f4f5">EN ↔ PT Translator</text>
          <text x="60" y="38" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#22c55e">[ai]</text>
          <circle cx="290" cy="20" r="4" fill="#22c55e"/>
          <text x="298" y="24" text-anchor="end" font-size="10" fill="#a1a1aa">running 4h 12m</text>
        </g>
        <g transform="translate(0,60)">
          <rect width="316" height="52" rx="10" fill="#27272a" opacity="0.5"/>
          <text x="14" y="30" font-size="18">🇧🇷🇬🇷</text>
          <text x="60" y="22" font-size="12" font-weight="600" fill="#f4f4f5">Trilingual EN ↔ PT + EL</text>
          <text x="60" y="38" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#22c55e">[tri]</text>
          <circle cx="290" cy="20" r="4" fill="#22c55e"/>
          <text x="298" y="24" text-anchor="end" font-size="10" fill="#a1a1aa">running 1h 38m</text>
        </g>
        <g transform="translate(0,120)">
          <rect width="316" height="52" rx="10" fill="#27272a" opacity="0.5"/>
          <text x="14" y="30" font-size="18">😂</text>
          <text x="60" y="22" font-size="12" font-weight="600" fill="#f4f4f5">Joke Bot</text>
          <text x="60" y="38" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#22c55e">[joke]</text>
          <circle cx="290" cy="20" r="4" fill="#22c55e"/>
          <text x="298" y="24" text-anchor="end" font-size="10" fill="#a1a1aa">running 12m</text>
        </g>
        <g transform="translate(0,180)">
          <rect width="316" height="52" rx="10" fill="#27272a" opacity="0.5"/>
          <text x="14" y="30" font-size="18">🥗</text>
          <text x="60" y="22" font-size="12" font-weight="600" fill="#f4f4f5">Health Coach</text>
          <text x="60" y="38" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#22c55e">[health]</text>
          <circle cx="290" cy="20" r="4" fill="#22c55e"/>
          <text x="298" y="24" text-anchor="end" font-size="10" fill="#a1a1aa">running 22m</text>
