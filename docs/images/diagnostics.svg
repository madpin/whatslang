          <rect width="540" height="40" rx="14" fill="white"/>
          <rect y="20" width="540" height="20" fill="white"/>
          <line x1="0" y1="40" x2="540" y2="40" stroke="#f4f4f5"/>
          <circle cx="22" cy="20" r="6" fill="#a855f7"/>
          <text x="36" y="25" font-size="13" font-weight="700" fill="#18181b">Database</text>
          <g transform="translate(20,68)">
            
            <g transform="translate(0,0)">
              <text x="0" y="14" font-size="11" fill="#71717a">Path</text>
              <text x="540" y="14" text-anchor="end" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#18181b">/data/messages.db</text>
            </g>
            <g transform="translate(0,26)">
              <text x="0" y="14" font-size="11" fill="#71717a">Size</text>
              <text x="540" y="14" text-anchor="end" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#18181b">1.2 MiB</text>
            </g>
            <g transform="translate(0,52)">
              <text x="0" y="14" font-size="11" fill="#71717a">Chats</text>
              <text x="540" y="14" text-anchor="end" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#18181b">47</text>
            </g>
            <g transform="translate(0,78)">
              <text x="0" y="14" font-size="11" fill="#71717a">Assignments</text>
              <text x="540" y="14" text-anchor="end" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#18181b">12</text>
            </g>
            <g transform="translate(0,104)">
              <text x="0" y="14" font-size="11" fill="#71717a">Processed msgs</text>
              <text x="540" y="14" text-anchor="end" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#18181b">9 821</text>
            </g>
            <g transform="translate(0,130)">
              <text x="0" y="14" font-size="11" fill="#71717a">WAL</text>
              <text x="540" y="14" text-anchor="end" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#18181b">✓ on</text>
            </g>
          </g>
        </g>
        <g transform="translate(580,240)" filter="url(#cardShadow)">
          <rect width="540" height="220" rx="14" fill="white" stroke="#e4e4e7"/>
          <rect width="540" height="40" rx="14" fill="white"/>
          <rect y="20" width="540" height="20" fill="white"/>
          <line x1="0" y1="40" x2="540" y2="40" stroke="#f4f4f5"/>
          <circle cx="22" cy="20" r="6" fill="#f59e0b"/>
          <text x="36" y="25" font-size="13" font-weight="700" fill="#18181b">Bot runtime</text>
          <g transform="translate(20,68)">
            
            <g transform="translate(0,0)">
              <text x="0" y="14" font-size="11" fill="#71717a">Catalog size</text>
              <text x="540" y="14" text-anchor="end" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#18181b">4</text>
            </g>
            <g transform="translate(0,26)">
              <text x="0" y="14" font-size="11" fill="#71717a">Running bots</text>
              <text x="540" y="14" text-anchor="end" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#18181b">8</text>
            </g>
            <g transform="translate(0,52)">
              <text x="0" y="14" font-size="11" fill="#71717a">Poll interval</text>
              <text x="540" y="14" text-anchor="end" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#18181b">5 s</text>
            </g>
            <g transform="translate(0,78)">
              <text x="0" y="14" font-size="11" fill="#71717a">Threads</text>
              <text x="540" y="14" text-anchor="end" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#18181b">8 alive</text>
            </g>
            <g transform="translate(0,104)">
              <text x="0" y="14" font-size="11" fill="#71717a">Last error</text>
              <text x="540" y="14" text-anchor="end" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#18181b">—</text>
            </g>
            <g transform="translate(0,130)">
              <text x="0" y="14" font-size="11" fill="#71717a">Uptime</text>
              <text x="540" y="14" text-anchor="end" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#18181b">3 d 7 h</text>
            </g>
          </g>
        </g>
  </g>

  <!-- Recent errors -->
  <g transform="translate(252,592)" filter="url(#cardShadow)">
    <rect width="1140" height="248" rx="14" fill="white" stroke="#e4e4e7"/>
    <g transform="translate(24,28)">
      <text font-size="13" font-weight="700" fill="#18181b">Recent gateway errors</text>
      <text y="18" font-size="11" fill="#71717a">Last 3 non-2xx responses from the WhatsApp gateway.</text>
    </g>
    <g transform="translate(24,80)">
      <text x="0" y="14" font-size="10" font-weight="700" fill="#71717a" letter-spacing="1">TIME</text>
      <text x="80" y="14" font-size="10" font-weight="700" fill="#71717a" letter-spacing="1">ENDPOINT</text>
      <text x="200" y="14" font-size="10" font-weight="700" fill="#71717a" letter-spacing="1">STATUS</text>
      <text x="264" y="14" font-size="10" font-weight="700" fill="#71717a" letter-spacing="1">MESSAGE</text>
      <line x1="0" y1="22" x2="1080" y2="22" stroke="#f4f4f5"/>
      <g transform="translate(0,32)">
        
        <g transform="translate(0,0)">
          <text x="0" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#a1a1aa">16:38:12</text>
          <rect x="80" y="6" width="100" height="20" rx="6" fill="#f4f4f5"/>
          <text x="130" y="20" text-anchor="middle" font-size="11" font-weight="600" fill="#52525b">get_messages</text>
          <rect x="200" y="6" width="44" height="20" rx="6" fill="#fee2e2"/>
          <text x="222" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">502</text>
          <text x="264" y="20" font-size="11" fill="#27272a">upstream timeout</text>
        </g>
        <g transform="translate(0,32)">
          <text x="0" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#a1a1aa">12:04:09</text>
          <rect x="80" y="6" width="100" height="20" rx="6" fill="#f4f4f5"/>
          <text x="130" y="20" text-anchor="middle" font-size="11" font-weight="600" fill="#52525b">send_message</text>
          <rect x="200" y="6" width="44" height="20" rx="6" fill="#fee2e2"/>
          <text x="222" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">429</text>
          <text x="264" y="20" font-size="11" fill="#27272a">rate limit, retry after 12s</text>
        </g>
        <g transform="translate(0,64)">
          <text x="0" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#a1a1aa">08:51:42</text>
          <rect x="80" y="6" width="100" height="20" rx="6" fill="#f4f4f5"/>
          <text x="130" y="20" text-anchor="middle" font-size="11" font-weight="600" fill="#52525b">download_audio</text>
          <rect x="200" y="6" width="44" height="20" rx="6" fill="#fee2e2"/>
          <text x="222" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">404</text>
          <text x="264" y="20" font-size="11" fill="#27272a">media not found</text>
        </g>
      </g>
    </g>
  </g>
</svg>
