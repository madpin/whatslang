name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest

      - name: Lint backend (ruff)
        run: ruff check app/

      - name: Type-check backend (mypy)
        run: mypy app/ --ignore-missing-imports || true

      - name: Smoke-import backend
        run: python -c "from app.main import app; print('routes=', len(app.routes))"

      - name: Run backend tests (if any)
        run: |
          if [ -d tests ]; then
            pytest -q
          else
            echo "No tests/ directory; skipping pytest."
          fi

      - name: Set up Node.js (only on 3.11)
        if: matrix.python-version == '3.11'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Frontend type-check + build (only on 3.11)
        if: matrix.python-version == '3.11'
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npx tsc -b
          npm run build

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: whatslang:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
